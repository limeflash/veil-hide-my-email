[package]
name = "hme-ui"
description = "Veil popup, options and welcome pages (Leptos, compiled to WASM)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
hme-core.workspace = true
hme-web.workspace = true
serde.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
web-sys = { workspace = true, features = ["Document", "Element", "HtmlElement", "Window", "DomTokenList", "Node", "SvgElement", "SvgsvgElement"] }
