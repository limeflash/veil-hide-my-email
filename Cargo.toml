[workspace]
resolver = "2"
members = ["crates/core", "crates/web", "crates/background", "crates/ui", "xtask"]
default-members = ["crates/core", "crates/web", "crates/background", "crates/ui", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/limeflash/veil-hide-my-email"

[workspace.dependencies]
hme-core = { path = "crates/core" }
hme-web = { path = "crates/web" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# wasm-bindgen must match the installed wasm-bindgen-cli exactly.
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
serde-wasm-bindgen = "0.6"
futures = { version = "0.3", default-features = false, features = ["std", "alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
